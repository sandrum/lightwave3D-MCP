name: tests

# Runs the offline test suite (no LightWave needed) on every push to any
# branch, every pull request into any branch, and on demand from the
# Actions tab. GitHub only runs a workflow on a branch that contains this
# file - branches made from main have it. See tests/conftest.py for what is
# and isn't covered.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        # server.py supports both mcp major versions - test each.
        mcp: ["mcp[cli]>=1.20,<2", "mcp[cli]>=2,<3"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt "${{ matrix.mcp }}"
      - name: Unit tests
        run: python -m pytest tests/unit -v
      - name: Repository checks
        run: python -m pytest tests/repo_checks -v
