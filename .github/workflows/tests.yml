name: tests

# Runs the offline test suite (no LightWave needed) on every push and pull
# request. See tests/conftest.py for what is and isn't covered.
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest tests/unit -v
      - name: Repository checks
        run: python -m pytest tests/repo_checks -v
